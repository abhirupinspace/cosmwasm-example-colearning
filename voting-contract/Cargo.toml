[package]
name = "voting-contract"
version = "0.1.0"
authors = ["abhirupbanerjee <silonelabs@gmail.com>"]
edition = "2021"
rust-version = "1.78"

exclude = [
  # cargo-generate / build artefacts that must never end up in the crate
  "artifacts/",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
# (needed when this crate is imported by another contract)
library = []

[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true

[dependencies]
cosmwasm-schema = "2.2"
cosmwasm-std = { version = "2.2", features = ["stargate"] }
cw-storage-plus = "2.0"
cw2 = "2.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
cw-multi-test = "2.2"
